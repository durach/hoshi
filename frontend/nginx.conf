server {
    listen 80;

    # No auth on the dashboard: the port is bound to loopback and reached only
    # via the local Caddy host, so a login prompt would add friction, not safety.
    location / {
        root /usr/share/nginx/html;
        index index.html;
        # Revalidate every load: the dashboard is a handful of local files, so
        # caching buys nothing and a stale app.js/style.css after a rebuild costs
        # real confusion. index.html is regenerated per start with the token.
        add_header Cache-Control "no-cache";
    }

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /ws {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400;
    }
}
